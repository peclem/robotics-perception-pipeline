# =============================================================================
# Robotics Perception Pipeline — CI
#
# Runs on every push and pull request to main.
# Uses CPU-only torch (no GPU available on GitHub runners).
# Integration tests (@pytest.mark.integration) are excluded — they need
# real GPU + downloaded model weights and run locally only.
#
# Optional deps (transformers / ultralytics / rerun-sdk / accelerate) come
# from the package's [project.optional-dependencies] table — the source of
# truth for which extras the project supports. Adding a new optional
# backend just means adding it to pyproject.toml's `all` extra; this
# workflow picks it up automatically.
#
# Environment overrides used:
#   DEVICE=cpu          → detector.device override
#   RERUN_ENABLED=false → disables Rerun.io (no viewer in CI)
# =============================================================================

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit tests (Python 3.10, CPU)
    runs-on: ubuntu-22.04

    env:
      DEVICE: cpu
      RERUN_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # CPU-only torch must land BEFORE `pip install -e .[all]` — the
      # project's [project.dependencies] declares plain `torch>=2.0`,
      # which would otherwise resolve to the CUDA variant. Installing
      # CPU torch first satisfies the version constraint with the
      # variant we want; the editable install then skips re-installing
      # torch.
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio \
            --index-url https://download.pytorch.org/whl/cpu

      # Install package + all optional backends + dev extras (pytest).
      # The `[all,dev]` extras pull ultralytics / transformers /
      # accelerate / rerun-sdk / pytest. Single source of truth: the
      # extras live in pyproject.toml, not duplicated here.
      - name: Install package with all extras
        run: pip install -e ".[all,dev]" pytest-cov

      - name: Run unit tests
        run: |
          python -m pytest tests/ \
            -m "not integration" \
            -v \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false
