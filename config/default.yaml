pipeline:
  name: robotics-perception-pipeline
  log_level: INFO
  target_hz: 30
  output_video_path: null
  seed: 42
camera:
  device_index: 0
  width: 1280
  height: 720
  fps: 30
  intrinsics_path: null
video:
  input_path: data/test_clip.mp4
  output_path: data/output.mp4
  playback_fps: null
  loop: false
synthetic_camera:
  width: 640
  height: 480
  num_frames: 300
  fps: 30.0
  num_objects: 3
  seed: 42
detector:
  model: runs/detect/mot17_finetune-2/weights/best.pt
  confidence_threshold: 0.25
  iou_threshold: 0.45
  device: cuda:0
  half_precision: true
  class_filter: null
  max_detections: 100
  img_size: 640
tracker:
  high_thresh: 0.5
  low_thresh: 0.1
  new_track_thresh: 0.5
  iou_threshold: 0.3
  max_age: 30
  min_hits: 1
  use_ekf: false
kalman_filter:
  initial_covariance:
    p_position: 10.0
    p_size: 10.0
    p_velocity: 100.0
  process_noise:
    q_position: 1.0
    q_size: 1.0
    q_velocity: 0.1
    q_vel_size: 0.02
  measurement_noise:
    r_center: 1.0
    r_size: 1.0
extended_kalman_filter:
  initial_covariance:
    p_position: 10.0
    p_size: 10.0
    p_velocity: 100.0
    p_omega: 1.0
  process_noise:
    q_position: 1.0
    q_size: 1.0
    q_velocity: 0.1
    q_vel_size: 0.02
    q_omega: 0.01
  measurement_noise:
    r_center: 1.0
    r_size: 1.0
visualization:
  rerun_enabled: true
  rerun_app_id: robotics_perception_pipeline
  rerun_host: auto
  rerun_port: 9876
  rerun_save_path: null
  show_bboxes: true
  show_track_ids: true
  show_velocity: true
  show_covariance_ellipse: true
  show_nis: false
  show_stats_overlay: true
  bbox_thickness: 2
  velocity_arrow_scale: 0.5
world_model:
  max_history: 30
  lost_timeout_s: 1.5
benchmark:
  dataset_path: data/MOT17
  split: train
  sequences: null
  output_dir: data/benchmark_results
depth:
  enabled: false
  model: depth-anything/Depth-Anything-V2-Metric-Indoor-Small-hf
  device: cuda
