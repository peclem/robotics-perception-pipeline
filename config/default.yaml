# =============================================================================
# Robotics Perception Pipeline — master configuration
# =============================================================================
#
# Load with:
#   from perception.config_loader import load_config
#   cfg = load_config("config/default.yaml")
#
# Environment variable overrides (applied before validation):
#   DEVICE          → detector.device          e.g. DEVICE=cpu
#   CONFIDENCE      → detector.confidence_threshold
#   HIGH_THRESH     → tracker.high_thresh
#   MAX_AGE         → tracker.max_age
#   LOG_LEVEL       → pipeline.log_level
#   RERUN_ENABLED   → visualization.rerun_enabled
#
# All spatial units are pixels or pixels/s unless noted.
# All matrix variances (Q, R, P) are in pixels² or pixels²/s².
# =============================================================================


# -----------------------------------------------------------------------------
# Pipeline
# -----------------------------------------------------------------------------
pipeline:
  name: "robotics-perception-pipeline"
  log_level: "INFO"
  target_hz: 30
  output_video_path: null
  seed: 42


# -----------------------------------------------------------------------------
# Camera — live webcam (WebcamCamera)
# -----------------------------------------------------------------------------
camera:
  device_index: 0
  width: 1280
  height: 720
  fps: 30
  # null until you run scripts/calibrate_camera.py (Step 12)
  intrinsics_path: null


# -----------------------------------------------------------------------------
# Video file replay (VideoFileCamera)
# -----------------------------------------------------------------------------
video:
  input_path:  "data/test_clip.mp4"
  output_path: "data/output.mp4"
  playback_fps: null
  loop: false


# -----------------------------------------------------------------------------
# Synthetic camera (SyntheticCamera — tests and CI)
# -----------------------------------------------------------------------------
synthetic_camera:
  width: 640
  height: 480
  num_frames: 300
  fps: 30.0
  num_objects: 3
  seed: 42


# -----------------------------------------------------------------------------
# Detector (YOLOv8Detector)
# -----------------------------------------------------------------------------
detector:
  model: "yolov8n.pt"

  # Absolute floor — nothing below this enters the pipeline.
  # ByteTrack stage-2 rescue threshold is set separately in tracker.low_thresh.
  # Range: (0.0, 1.0)
  confidence_threshold: 0.25

  # NMS overlap threshold. Range: (0.0, 1.0)
  iou_threshold: 0.45

  # 'cuda:0' for 4070Ti. Override: DEVICE=cpu python launch.py
  device: "cuda:0"

  # ~2× speedup on 4070Ti. Auto-disabled when device='cpu'.
  half_precision: true

  # null = all 80 COCO classes.
  # [0] = person only. [0,2,5,7] = person, car, bus, truck.
  class_filter: null

  # Hard cap per frame.
  max_detections: 100

  # Must be a multiple of 32.
  img_size: 640


# -----------------------------------------------------------------------------
# Tracker (ByteTracker)
# -----------------------------------------------------------------------------
#
# Two-stage association:
#   Stage 1 — D_high (conf >= high_thresh) vs ALL tracks
#             updates tracks, creates new ones from unmatched D_high
#   Stage 2 — D_low (low_thresh <= conf < high_thresh) vs unmatched S1 tracks
#             rescues partially-occluded tracks, never creates new ones
#   Discarded — conf < low_thresh
#
# Enforced at load: low_thresh < high_thresh
# -----------------------------------------------------------------------------
tracker:
  high_thresh: 0.50
  low_thresh:  0.10
  new_track_thresh: 0.50
  iou_threshold: 0.30
  max_age: 30   # frames a LOST track survives — 30 @ 30fps = 1 second
  min_hits: 1   # hits to promote TENTATIVE → CONFIRMED


# -----------------------------------------------------------------------------
# Kalman Filter
# -----------------------------------------------------------------------------
#
# State vector: x = [cx, cy, w, h, vx, vy, vw, vh]
#
# NIS consistency check (run after tuning):
#   Consistent : mean NIS ≈ 4.0  (χ²(4) expected value)
#   NIS >> 9.49 → overconfident (Q too small / R too large)
#   NIS << 0.71 → underconfident (Q too large / R too small)
# -----------------------------------------------------------------------------
kalman_filter:

  initial_covariance:
    p_position: 10.0    # pixels²    — cx, cy, w, h at track birth
    p_size:     10.0
    p_velocity: 100.0   # pixels²/s² — vx, vy, vw, vh (unobserved at birth)

  process_noise:
    q_position: 1.0     # pixels²/s
    q_size:     1.0     # pixels²/s
    q_velocity: 0.1     # pixels²/s³
    q_vel_size: 0.02    # pixels²/s³

  measurement_noise:
    r_center: 1.0       # pixels² — cx, cy
    r_size:   1.0       # pixels² — w, h


# -----------------------------------------------------------------------------
# Visualization
# -----------------------------------------------------------------------------
visualization:
  # Rerun viewer must be open on Windows before launch.
  # Override: RERUN_ENABLED=false python launch.py
  rerun_enabled: true
  rerun_app_id: "robotics_perception_pipeline"

  show_bboxes:             true
  show_track_ids:          true
  show_velocity:           true   # KF velocity arrow
  show_covariance_ellipse: true   # 2σ position uncertainty ellipse
  show_nis:                false  # NIS value per track (debug)
  show_stats_overlay:      true   # FPS, det/track counts

  bbox_thickness:       2
  velocity_arrow_scale: 0.5


# -----------------------------------------------------------------------------
# Benchmark (Step 13)
# -----------------------------------------------------------------------------
benchmark:
  dataset_path: "data/MOT17"
  split:        "train"
  sequences:    null
  output_dir:   "data/benchmark_results"
