# Camera intrinsics — generated by scripts/calibrate_camera.py
# These values are for a 1280x720 webcam. Replace with your own calibration.
#
# How to calibrate:
#   python scripts/calibrate_camera.py --device 0 --rows 9 --cols 6 --out config/camera_intrinsics.yaml
#
# Robotics note:
#   fx, fy are focal lengths in pixels. For a real robot, these come from
#   the camera datasheet or an OpenCV calibration run on a checkerboard.
#   Without calibration, metric-space position estimates are wrong by
#   up to 20–30%.

camera_matrix:
  fx: 923.5
  fy: 923.1
  cx: 637.2
  cy: 361.4

image_size:
  width: 1280
  height: 720

# k1, k2, p1, p2, k3
dist_coeffs: [-0.042, 0.018, 0.0003, -0.0002, 0.0]

# Reprojection error from calibration (pixels) — lower is better; <1.0 is good
reprojection_error: 0.43
